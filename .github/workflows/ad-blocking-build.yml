name: Build ad-blocker apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'addons/ad-blocking/**'
      - '.github/workflows/ad-blocking-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Ad Blocking APK
        working-directory: addons/ad-blocking
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-blocker
          path: addons/ad-blocking/app/build/outputs/apk/debug/*.apk
